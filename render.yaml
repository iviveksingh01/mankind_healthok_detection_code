services:
  - type: web
    name: mankind-healthok-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false          # fill in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false          # fill in Render dashboard
      - key: SUPABASE_BUCKET
        value: output-images
    healthCheckPath: /docs